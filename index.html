<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FutPlan – Arões SC</title>
  <meta name="description" content="Gestão de jogos e treinos do Arões Sport Clube">
  <meta name="theme-color" content="#1a3f7a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FutPlan">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">

  <style>
    /* ── Layout: sticky nav + duas vistas (mapa mensal / microciclo) ── */
    :root {
      --bg:        #f0f2f5;
      --surface:   #ffffff;
      --surface2:  #f7f8fa;
      --border:    #e2e6ec;
      --fg:        #111827;
      --fg2:       #4b5563;
      --fg3:       #9ca3af;
      --accent:    #1a3f7a;
      --accent2:   #2563eb;
      --accent-bg: #dbeafe;
      --danger:    #dc2626;
      --success:   #16a34a;
      --warn:      #d97706;
      --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --radius:    8px;
      --nav-h:     56px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:        #0f1117;
        --surface:   #1a1d27;
        --surface2:  #22263a;
        --border:    #2d3148;
        --fg:        #e8eaf0;
        --fg2:       #9ea3b8;
        --fg3:       #5a607a;
        --accent:    #3b6ed4;
        --accent2:   #5b8aff;
        --accent-bg: #1a2a4a;
        --shadow:    0 1px 3px rgba(0,0,0,.4);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --border:    #2d3148;
      --fg:        #e8eaf0;
      --fg2:       #9ea3b8;
      --fg3:       #5a607a;
      --accent:    #3b6ed4;
      --accent2:   #5b8aff;
      --accent-bg: #1a2a4a;
      --shadow:    0 1px 3px rgba(0,0,0,.4);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── NAV ── */
    .nav {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 100;
      background: var(--accent);
      display: flex;
      align-items: center;
      gap: 0;
      height: var(--nav-h);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--accent);
      z-index: 110;
    }
    .nav-brand {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: .02em;
      margin-right: auto;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-brand svg { flex-shrink: 0; }
    .nav-brand span { opacity: .65; font-weight: 600; }
    .nav-tabs { display: flex; gap: 2px; }
    .nav-tab {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,.65);
      cursor: pointer;
      border: none;
      background: none;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .nav-tab.active, .nav-tab:hover { background: rgba(255,255,255,.18); color: #fff; }
    .nav-tab.active { background: rgba(255,255,255,.25); }
    .nav-btn {
      margin-left: 8px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background .15s;
      white-space: nowrap;
    }
    .nav-btn-login { background: rgba(255,255,255,.2); color: #fff; }
    .nav-btn-login:hover { background: rgba(255,255,255,.3); }
    .nav-btn-logout { background: rgba(220,38,38,.7); color: #fff; }

    /* ── MAIN ── */
    .main {
      padding-block: 20px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      max-width: 1400px;
      margin: 0 auto;
    }
    .view { display: none; }
    .view.active { display: block; }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .toolbar-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--accent2);
      margin-right: auto;
    }
    .btn {
      padding: 7px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn-primary { background: var(--accent2); color: #fff; }
    .btn-ghost { background: var(--surface); color: var(--fg2); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ── NAVEGADORES ── */
    .period-nav { display: flex; align-items: center; gap: 8px; }
    .period-nav .period-label {
      font-weight: 700; font-size: 14px;
      min-width: 160px; text-align: center; color: var(--fg);
    }
    .period-nav button {
      width: 30px; height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg2);
      cursor: pointer;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .period-nav button:hover { background: var(--accent-bg); }

    /* ── TABELAS ── */
    .table-wrap { overflow-x: auto; border-radius: var(--radius); box-shadow: var(--shadow); }
    .mapa-table, .micro-table {
      border-collapse: collapse;
      width: 100%;
      background: var(--surface);
      font-size: 13px;
    }
    .mapa-table { min-width: 700px; }
    .micro-table { min-width: 750px; }

    .mapa-table th, .micro-table th {
      background: var(--accent);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 8px 10px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.12);
      white-space: nowrap;
    }
    .mapa-table th.col-esc, .micro-table th.col-esc {
      text-align: left; min-width: 110px;
      position: sticky; left: 0; z-index: 2;
    }
    .mapa-table th.col-date { min-width: 130px; }

    .mapa-table td, .micro-table td {
      border: 1px solid var(--border);
      padding: 0;
      vertical-align: top;
      position: relative;
    }
    .mapa-table td.col-esc, .micro-table td.col-esc {
      position: sticky; left: 0;
      background: var(--surface);
      z-index: 1;
      padding: 10px;
      min-width: 110px;
    }
    .esc-nome { font-weight: 700; font-size: 13px; line-height: 1.2; }
    .esc-sub  { font-size: 11px; color: var(--fg3); margin-top: 2px; }

    /* Chips jogos */
    .cell-inner { min-height: 70px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
    .cell-inner:empty::after {
      content: '—'; color: var(--fg3); font-size: 18px;
      display: block; text-align: center; padding-top: 10px;
    }
    .jogo-chip {
      border-radius: 5px; padding: 4px 7px;
      font-size: 12px; line-height: 1.3;
      cursor: pointer; border: none;
      text-align: left; display: block; width: 100%;
      transition: filter .12s;
    }
    .jogo-chip:hover { filter: brightness(.92); }
    .jogo-chip .jornada { font-size: 10px; font-weight: 700; opacity: .75; letter-spacing: .05em; }
    .jogo-chip .adversario { font-weight: 600; }
    .jogo-chip .hora { font-size: 11px; opacity: .8; }
    .chip-C { background: #dbeafe; color: #1e40af; }
    .chip-F { background: #fef3c7; color: #92400e; }
    .chip-adiado { opacity: .6; text-decoration: line-through; }
    .chip-cancelado { opacity: .5; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .chip-C { background: #1e3a6e; color: #93c5fd; }
      :root:not([data-theme="light"]) .chip-F { background: #3d2a00; color: #fcd34d; }
    }
    :root[data-theme="dark"] .chip-C { background: #1e3a6e; color: #93c5fd; }
    :root[data-theme="dark"] .chip-F { background: #3d2a00; color: #fcd34d; }

    /* Chips treinos */
    .treino-chip {
      margin: 4px 6px; border-radius: 5px; padding: 5px 7px;
      font-size: 11.5px; line-height: 1.35;
      cursor: pointer; border: none; text-align: left; display: block;
      transition: filter .12s;
      background: #dcfce7; color: #14532d;
    }
    .treino-chip:hover { filter: brightness(.9); }
    .treino-chip .hora { font-weight: 700; font-size: 12px; }
    .treino-chip .local { font-size: 11px; opacity: .8; }
    .treino-chip.jogo_treino { background: #fef9c3; color: #713f12; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .treino-chip { background: #14532d; color: #bbf7d0; }
      :root:not([data-theme="light"]) .treino-chip.jogo_treino { background: #3d2b00; color: #fde68a; }
    }
    :root[data-theme="dark"] .treino-chip { background: #14532d; color: #bbf7d0; }
    :root[data-theme="dark"] .treino-chip.jogo_treino { background: #3d2b00; color: #fde68a; }

    /* Botão + na célula */
    .cell-add {
      opacity: 0; position: absolute; bottom: 4px; right: 4px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent2); color: #fff;
      border: none; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .15s;
    }
    td:hover .cell-add { opacity: 1; }

    /* ── MODALS ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: max(16px, env(safe-area-inset-left, 0px));
    }
    .overlay[hidden] { display: none !important; }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      width: 100%; max-width: 480px;
      max-height: 90vh; overflow-y: auto;
      padding: 24px;
    }
    .modal-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 700;
      color: var(--accent2); margin: 0 0 20px;
    }
    .form-row { margin-bottom: 14px; }
    .form-row label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--fg2); margin-bottom: 4px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%; padding: 8px 10px;
      border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--fg);
      font-size: 14px; font-family: inherit; outline: none;
      transition: border-color .15s;
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--accent2); }
    .form-row textarea { resize: vertical; min-height: 60px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-footer {
      display: flex; gap: 8px; justify-content: flex-end;
      margin-top: 20px; flex-wrap: wrap;
    }

    /* Login */
    .login-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px; font-weight: 700; color: var(--accent2); margin-bottom: 4px;
    }
    .login-sub { font-size: 13px; color: var(--fg2); margin-bottom: 20px; }

    /* Toast */
    .toast {
      position: fixed; bottom: max(24px, env(safe-area-inset-bottom, 24px));
      left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1e293b; color: #fff;
      padding: 10px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
      transition: transform .3s ease;
      z-index: 300; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Legenda */
    .legend {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 10px; font-size: 12px;
      align-items: center; color: var(--fg2);
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    /* Loading */
    .loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 60px 20px; color: var(--fg3);
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border); border-top-color: var(--accent2);
      border-radius: 50%; animation: spin .7s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── VISTA PAIS ── */
    .filter-sel {
      padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--fg); font-size: 13px; font-family: inherit; outline: none;
    }
    .pais-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .jogo-card {
      background: var(--surface);
      border-radius: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .jogo-card-head {
      padding: 10px 14px 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .jogo-card-esc {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px; font-weight: 700; flex: 1;
    }
    .jogo-card-cf {
      font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
    }
    .cf-C { background: #dbeafe; color: #1e40af; }
    .cf-F { background: #fef3c7; color: #92400e; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .cf-C { background: #1e3a6e; color: #93c5fd; }
      :root:not([data-theme="light"]) .cf-F { background: #3d2a00; color: #fcd34d; }
    }
    :root[data-theme="dark"] .cf-C { background: #1e3a6e; color: #93c5fd; }
    :root[data-theme="dark"] .cf-F { background: #3d2a00; color: #fcd34d; }
    .jogo-card-body { padding: 0 14px 14px; }
    .jogo-card-adv {
      font-size: 18px; font-weight: 700; line-height: 1.2;
      color: var(--fg); margin-bottom: 6px;
    }
    .jogo-card-adv small { font-size: 12px; font-weight: 400; color: var(--fg2); display: block; }
    .jogo-card-meta {
      display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--fg2);
    }
    .jogo-card-meta span {
      display: flex; align-items: center; gap: 3px;
    }
    .jogo-card-sep { height: 1px; background: var(--border); margin: 0 14px; }
    .pais-empty {
      text-align: center; padding: 60px 20px;
      color: var(--fg3); font-size: 14px;
    }
    .pais-empty svg { display: block; margin: 0 auto 12px; opacity: .3; }

    /* ── EXPORTAÇÃO (print) ── */
    @media print {
      .nav, .toolbar, .overlay, .toast, #view-micro, #view-pais { display: none !important; }
      #view-mapa { display: block !important; }
      body { background: white; }
      .table-wrap { box-shadow: none; }
      .mapa-table th { background: #1a3f7a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .chip-C { background: #dbeafe !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .chip-F { background: #fef3c7 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    @media (max-width: 600px) {
      .nav-brand { font-size: 16px; }
      .toolbar-title { font-size: 18px; }
      .form-grid { grid-template-columns: 1fr; }
      .nav-tab { padding: 6px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-brand">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <circle cx="11" cy="11" r="10" stroke="rgba(255,255,255,.8)" stroke-width="1.5"/>
      <path d="M11 1 C6 4 3 8 3 11 C3 15 6 18 11 21 C16 18 19 15 19 11 C19 8 16 4 11 1Z" fill="rgba(255,255,255,.15)"/>
      <path d="M4 7 L18 7 M4 15 L18 15 M11 1 L11 21" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
    </svg>
    FutPlan <span>Arões SC</span>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" data-view="mapa">Mapa Mensal</button>
    <button class="nav-tab" data-view="micro">Microciclo</button>
    <button class="nav-tab" data-view="pais">👨‍👩‍👦 Pais</button>
  </div>
  <button class="nav-btn nav-btn-login" id="authBtn">🔑 Login</button>
</nav>

<main class="main">
  <!-- MAPA MENSAL -->
  <div class="view active" id="view-mapa">
    <div class="toolbar">
      <div class="toolbar-title">Mapa de Jogos</div>
      <div class="period-nav">
        <button id="prevMonth">&#8249;</button>
        <span class="period-label" id="monthLabel">—</span>
        <button id="nextMonth">&#8250;</button>
      </div>
      <button class="btn btn-ghost btn-sm" id="toggleWeekend">Só fins-de-semana</button>
      <button class="btn btn-ghost btn-sm" id="exportMapaBtn">⬇ Exportar</button>
      <button class="btn btn-primary btn-sm admin-only" id="addJogoBtn" hidden>+ Jogo</button>
    </div>
    <div class="legend">
      <span>Legenda:</span>
      <span class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span>Casa</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>Fora</span>
    </div>
    <div class="table-wrap" id="mapaWrap">
      <div class="loading"><div class="spinner"></div>A carregar…</div>
    </div>
  </div>

  <!-- MICROCICLO -->
  <div class="view" id="view-micro">
    <div class="toolbar">
      <div class="toolbar-title">Microciclo Semanal</div>
      <div class="period-nav">
        <button id="prevSemana">&#8249;</button>
        <span class="period-label" id="semanaLabel" style="min-width:200px">—</span>
        <button id="nextSemana">&#8250;</button>
      </div>
      <button class="btn btn-primary btn-sm admin-only" id="addTreinoBtn" hidden>+ Treino</button>
    </div>
    <div class="table-wrap" id="microWrap">
      <div class="loading"><div class="spinner"></div>A carregar…</div>
    </div>
  </div>
</main>

  <!-- VISTA PAIS -->
  <div class="view" id="view-pais">
    <div class="toolbar">
      <div class="toolbar-title">Próximos Jogos</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select class="filter-sel" id="paisEscalaoFilter"><option value="">Todos os escalões</option></select>
        <select class="filter-sel" id="paisPeriodo">
          <option value="semana">Esta semana</option>
          <option value="mes">Este mês</option>
          <option value="tudo">Todos</option>
        </select>
      </div>
    </div>
    <div id="paisCards" class="pais-grid"></div>
  </div>
</main>

<!-- MODAL JOGO -->
<div class="overlay" id="jogoOverlay" hidden>
  <div class="modal">
    <div class="modal-title" id="jogoModalTitle">Novo Jogo</div>
    <input type="hidden" id="jogoId">
    <div class="form-row"><label>Escalão</label><select id="jogoEscalao"></select></div>
    <div class="form-grid">
      <div class="form-row"><label>Data</label><input type="date" id="jogoData"></div>
      <div class="form-row"><label>Hora</label><input type="time" id="jogoHora"></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>Jornada nº</label><input type="number" id="jogoJornada" min="1"></div>
      <div class="form-row"><label>Casa / Fora</label>
        <select id="jogoCasaFora"><option value="C">Casa (C)</option><option value="F">Fora (F)</option></select>
      </div>
    </div>
    <div class="form-row"><label>Adversário</label><input type="text" id="jogoAdversario" placeholder="Nome do clube"></div>

function renderMapa() {
  const y=mapDate.getFullYear(), m=mapDate.getMonth();
  document.getElementById('monthLabel').textContent = fmt(mapDate,{month:'long',year:'numeric'});

  const firstDay=new Date(y,m,1), lastDay=new Date(y,m+1,0);
  const isoSet = new Set();
  for (let d=new Date(firstDay); d<=lastDay; d.setDate(d.getDate()+1)) {
    const iso = isoDate(d);
    const dow = d.getDay();
    if (!showOnlyWeekend || dow===6 || dow===0) {
      if (dow===6||dow===0||jogos.some(j=>j.data===iso)) isoSet.add(iso);
    }
  }
  const dates = [...isoSet].sort().map(parseDateLocal);

  let html = `<table class="mapa-table">
    <thead><tr>
      <th class="col-esc">Equipa</th>
      ${dates.map(d=>`<th class="col-date">${fmt(d,{weekday:'short'}).toUpperCase()}<br><span style="font-size:11px;font-family:Inter,sans-serif;font-weight:500">${fmt(d,{day:'2-digit',month:'2-digit',year:'numeric'})}</span></th>`).join('')}
    </tr></thead>
    <tbody>`;

  escaloes.filter(e=>e.ativo).forEach(esc => {
    html += `<tr><td class="col-esc">
      <div class="esc-nome" style="color:${esc.cor||'var(--accent2)'}">${esc.nome}</div>
      ${esc.sub?`<div class="esc-sub">${esc.sub}${esc.ano_nasc?' '+esc.ano_nasc:''}</div>`:''}
    </td>`;
    dates.forEach(d => {
      const iso = isoDate(d);
      const dj = jogos.filter(j=>j.escalao_id===esc.id&&j.data===iso);
      const chips = dj.map(j=>`<button class="jogo-chip chip-${j.casa_fora} chip-${j.estado||'agendado'}" onclick="editJogo(${j.id})">
        ${j.jornada?`<div class="jornada">JORNADA ${j.jornada}</div>`:''}
        <div class="adversario">${j.adversario} (${j.casa_fora})</div>
        ${j.hora?`<div class="hora">⏰ ${j.hora.slice(0,5)}</div>`:''}
        ${j.local?`<div class="hora">📍 ${j.local}</div>`:''}
      </button>`).join('');
      const addBtn = isAdmin ? `<button class="cell-add" onclick="newJogo(${esc.id},'${iso}')">+</button>` : '';
      html += `<td><div class="cell-inner">${chips}</div>${addBtn}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('mapaWrap').innerHTML = html;
}

function renderMicro() {
  const days = Array.from({length:7},(_,i)=>addDays(microWeekStart,i));
  const dayNames = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  document.getElementById('semanaLabel').textContent =
    `${fmt(days[0],{day:'2-digit',month:'short'})} – ${fmt(days[6],{day:'2-digit',month:'short',year:'numeric'})}`;

  let html = `<table class="micro-table">
    <thead><tr>
      <th class="col-esc">Equipa</th>
      ${days.map((d,i)=>`<th>${dayNames[i]}<br><span style="font-size:11px;font-family:Inter,sans-serif;font-weight:500">${fmt(d,{day:'2-digit',month:'2-digit'})}</span></th>`).join('')}
    </tr></thead>
    <tbody>`;

  escaloes.filter(e=>e.ativo).forEach(esc => {
    html += `<tr><td class="col-esc">
      <div class="esc-nome" style="color:${esc.cor||'var(--accent2)'}">${esc.nome}</div>
      ${esc.sub?`<div class="esc-sub">${esc.sub}</div>`:''}
    </td>`;
    days.forEach(d => {
      const iso = isoDate(d);
      const dt = treinos.filter(t=>t.escalao_id===esc.id&&t.data===iso);
      const chips = dt.map(t=>{
        const hi=t.hora_inicio?t.hora_inicio.slice(0,5):'';
        const hf=t.hora_fim?t.hora_fim.slice(0,5):'';
        const hora = hi?(hf?`${hi}–${hf}`:hi):'';
        const local=[t.campo&&`Campo: ${t.campo}`,t.balneario&&`Bal.: ${t.balneario}`].filter(Boolean).join(' · ');
        const tipo=t.tipo==='jogo_treino'?'jogo_treino':'';
        return `<button class="treino-chip ${tipo}" onclick="editTreino(${t.id})">
          ${hora?`<div class="hora">${t.tipo==='jogo_treino'?'⚽ ':'🏃 '}${hora}</div>`:''}
          ${local?`<div class="local">${local}</div>`:''}
          ${t.observacoes?`<div class="local" style="font-style:italic">${t.observacoes}</div>`:''}
        </button>`;
      }).join('');
      const addBtn = isAdmin ? `<button class="cell-add" onclick="newTreino(${esc.id},'${iso}')">+</button>` : '';
      html += `<td><div style="min-height:60px;padding:2px 0">${chips}</div>${addBtn}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('microWrap').innerHTML = html;
}

function renderPais() {
  const escalaoFiltro = +document.getElementById('paisEscalaoFilter').value || null;
  const periodo = document.getElementById('paisPeriodo').value;
  const hoje = new Date(); hoje.setHours(0,0,0,0);

  let dataMin, dataMax;
  if (periodo === 'semana') {
    dataMin = hoje;
    dataMax = addDays(hoje, 7);
  } else if (periodo === 'mes') {
    dataMin = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    dataMax = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0);
  } else {
    dataMin = hoje;
    dataMax = new Date('2099-12-31');
  }

  let filtrados = jogos.filter(j => {
    const d = parseDateLocal(j.data);
    return d >= dataMin && d <= dataMax && j.adversario !== 'A Definir';
  });
  if (escalaoFiltro) filtrados = filtrados.filter(j => j.escalao_id === escalaoFiltro);
  filtrados.sort((a,b) => a.data.localeCompare(b.data) || (a.hora||'').localeCompare(b.hora||''));

  const container = document.getElementById('paisCards');
  if (!filtrados.length) {
    container.innerHTML = `<div class="pais-empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/>
      </svg>
      Sem jogos para o período selecionado.
    </div>`;
    return;
  }

  let html = '';
  let lastDate = '';
  filtrados.forEach(j => {
    const esc = escaloes.find(e => e.id === j.escalao_id);
    const d = parseDateLocal(j.data);
    const dateStr = fmt(d, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    const hora = j.hora ? j.hora.slice(0,5) : null;
    const jornada = j.jornada ? `Jornada ${j.jornada}` : '';

    if (j.data !== lastDate) {
      if (lastDate) html += '</div>';
      html += `<div style="grid-column:1/-1;margin-top:${lastDate?'8px':'0'}">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;
          color:var(--accent2);text-transform:uppercase;letter-spacing:.04em;
          border-bottom:2px solid var(--accent2);padding-bottom:4px;margin-bottom:10px">
          ${dateStr}
        </div>
      </div>
      <div style="display:contents">`;
      lastDate = j.data;
    }

    html += `<div class="jogo-card">
      <div class="jogo-card-head" style="border-left:4px solid ${esc?.cor||'var(--accent2)'}">
        <div class="jogo-card-esc" style="color:${esc?.cor||'var(--accent2)'}">${esc?.nome||''}</div>
        <span class="jogo-card-cf cf-${j.casa_fora}">${j.casa_fora === 'C' ? '🏠 Casa' : '✈️ Fora'}</span>
      </div>
      <div class="jogo-card-sep"></div>
      <div class="jogo-card-body">
        <div class="jogo-card-adv">
          ${j.adversario}
          ${jornada ? `<small>${jornada}</small>` : ''}
        </div>
        <div class="jogo-card-meta">
          ${hora ? `<span>⏰ ${hora}</span>` : ''}
          ${j.local ? `<span>📍 ${j.local}</span>` : ''}
          ${j.observacoes ? `<span>ℹ️ ${j.observacoes}</span>` : ''}
        </div>
      </div>
    </div>`;
  });
  if (lastDate) html += '</div>';
  container.innerHTML = html;
}

// Popula filtro de escalões na vista pais
function populatePaisFilter() {
  const sel = document.getElementById('paisEscalaoFilter');
  sel.innerHTML = '<option value="">Todos os escalões</option>' +
    escaloes.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
}

document.getElementById('paisEscalaoFilter').addEventListener('change', renderPais);
document.getElementById('paisPeriodo').addEventListener('change', renderPais);

// ── VIEWS (override para incluir pais) ──
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    const v = document.getElementById('view-'+tab.dataset.view);
    if (v) { v.classList.add('active'); if (tab.dataset.view==='pais') renderPais(); }
  });
});

// ── INIT ──
(async()=>{
  await initAuth();
  await loadAll();
  populatePaisFilter();
})();
</script>
</body>
</html>
